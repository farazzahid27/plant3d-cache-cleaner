name: Build and release

# Started by hand from the GitHub website:
#   Actions tab > "Build and release" > "Run workflow" > type a version > Run.
# The workflow builds the exe, signs it, creates the version tag and publishes
# the Release that users' copies update from.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number, e.g. 1.0.0 (must be higher than the last release)"
        required: true
        type: string

permissions:
  contents: write   # needed to create the tag and release

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Get the source code
        uses: actions/checkout@v4

      - name: Check the version number
        id: version
        shell: powershell
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $v = $env:INPUT_VERSION.Trim().TrimStart('v', 'V')
          if (-not ($v -match '^(\d+)\.(\d+)\.(\d+)(?:\.(\d+))?$')) {
            throw "Version '$($env:INPUT_VERSION)' must look like 1.2.3"
          }
          $revision = if ($Matches[4]) { $Matches[4] } else { '0' }
          $full = "$($Matches[1]).$($Matches[2]).$($Matches[3]).$revision"
          Write-Host "Building version $full (tag v$v)"
          "value=$full" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=v$v"     | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Stop if this version was already released
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view '${{ steps.version.outputs.tag }}' *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Release ${{ steps.version.outputs.tag }} already exists. Use a higher version number."
          }
          $global:LASTEXITCODE = 0

      # Windows PowerShell 5.1 (not pwsh) so signing behaves exactly as on your PC.
      - name: Build and sign
        shell: powershell
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if (-not $env:UPDATE_SIGNING_KEY) {
            throw 'The repository secret UPDATE_SIGNING_KEY is missing. See New-SigningKey.ps1.'
          }
          .\Build.ps1 -Repository '${{ github.repository }}' -Version '${{ steps.version.outputs.value }}'

      - name: Publish the GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ steps.version.outputs.tag }}' `
            dist/Plant3DCacheCleaner.exe `
            dist/update.json `
            dist/update.sig `
            --target '${{ github.sha }}' `
            --title "Plant 3D Cache Cleaner ${{ steps.version.outputs.tag }}" `
            --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Creating the release failed.' }
